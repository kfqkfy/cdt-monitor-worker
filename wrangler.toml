name = "cdt-monitor"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# 静态面板 (原版 template.html + vue + echarts)
[assets]
directory = "./static"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

# D1 数据库 — 不写 database_id 时 wrangler 自动创建/复用同名数据库（auto-provision）
[[d1_databases]]
binding = "DB"
database_name = "cdt_monitor"

# 每分钟触发监控（对应原版 cron * * * * *）
[triggers]
crons = ["* * * * *"]
